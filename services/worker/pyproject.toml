[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-accessibility-worker"
version = "1.0.0"
description = "Shared utilities for PDF accessibility processing pipeline"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "PDF Accessibility Team", email = "team@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.43.103",
    "botocore>=1.43.103",
    "aws-lambda-powertools[tracer,logger,metrics]>=3.35.0",
    "pydantic>=2.13.5",
    "pdfminer.six>=20260107",
    "pypdf>=6.19.0",
    "pikepdf>=10.14.0",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "typing-extensions>=4.16.0",
    "python-jose[cryptography]>=3.5.0",
    "requests>=2.34.2",
    "flask>=3.1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.1",
    "black>=26.5.1",
    "ruff>=0.16.9",
    "pre-commit>=4.6.2",
    "moto[s3,dynamodb,sqs]>=5.2.3",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_worker"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pdf_worker",
    "tests",
    "README.md",
    "LICENSE",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "botocore.*",
    "moto.*",
    "pdfminer.*",
    "pypdf.*",
    "pikepdf.*",
]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []
line-length = 100
target-version = "py311"

[tool.ruff.isort]
known-first-party = ["pdf_worker"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
# pdf_worker lives in src/; services.shared lives at the repository root.
pythonpath = ["src", "../.."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: marks tests as unit tests (deselect with '-m \"not unit\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/pdf_worker"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]