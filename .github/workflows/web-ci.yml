name: Web Application CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'vitest.config.ts'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'vitest.config.ts'
      - '.github/workflows/web-ci.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      skip_tests:
        description: 'Skip test execution'
        required: false
        default: false
        type: boolean
      force_deploy:
        description: 'Force deployment even if no changes detected'
        required: false
        default: false
        type: boolean
      emergency_deployment:
        description: 'Emergency deployment (bypasses some checks for non-prod)'
        required: false
        default: false
        type: boolean

permissions:
  id-token: write
  contents: read
  pull-requests: write

env:
  NODE_VERSION: '24'
  WEB_WORKING_DIR: 'web'
  # pnpm/action-setup reads the pnpm version from packageManager in package.json.

jobs:
  setup-environment:
    name: Setup Environment Configuration
    runs-on: ubuntu-latest
    outputs:
      require_approval: ${{ steps.env-config.outputs.require_approval }}
      security_threshold: ${{ steps.env-config.outputs.security_threshold }}
      deployment_strategy: ${{ steps.env-config.outputs.deployment_strategy }}
      resource_prefix: ${{ steps.env-config.outputs.resource_prefix }}
      testing_config: ${{ steps.env-config.outputs.testing_config }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment configuration
        id: env-config
        uses: ./.github/actions/setup-environment
        with:
          environment: ${{ inputs.environment || 'dev' }}

  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      web_changed: ${{ steps.changes.outputs.web_changed }}
      should_deploy: ${{ steps.deploy-decision.outputs.should_deploy }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect web application changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            if [ "${{ inputs.force_deploy }}" == "true" ]; then
              echo "web_changed=true" >> $GITHUB_OUTPUT
              echo "Force deployment requested"
            else
              echo "web_changed=true" >> $GITHUB_OUTPUT
              echo "Manual dispatch - assuming changes"
            fi
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "web_changed=true" >> $GITHUB_OUTPUT
            echo "Pull request - running tests and build validation"
          else
            # Check for changes in web directory or workflow
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} 2>/dev/null || echo "")

            if [ -z "$CHANGED_FILES" ]; then
              # If we can't detect changes (e.g., first push), assume changes
              echo "web_changed=true" >> $GITHUB_OUTPUT
              echo "Cannot detect changes - assuming web changes"
            elif echo "$CHANGED_FILES" | grep -q "^web/\|^\.github/workflows/web-ci\.yml"; then
              echo "web_changed=true" >> $GITHUB_OUTPUT
              echo "Web application changes detected"
            else
              echo "web_changed=false" >> $GITHUB_OUTPUT
              echo "No web application changes detected"
            fi
          fi

      - name: Determine deployment decision
        id: deploy-decision
        run: |
          if [ "${{ steps.changes.outputs.web_changed }}" == "true" ] && [ "${{ github.ref }}" == "refs/heads/main" ] && [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "Will deploy to ${{ inputs.environment || 'dev' }}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ "${{ steps.changes.outputs.web_changed }}" == "true" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "Will deploy to ${{ inputs.environment || 'dev' }} via manual dispatch"
          else
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "Will not deploy"
          fi

  dependency-security-scan:
    name: Web Dependency Security Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.web_changed == 'true'
    outputs:
      security_passed: ${{ steps.security-check.outputs.security_passed }}
      # The deployment gate reads these counts
      npm_critical: ${{ steps.npm-audit.outputs.npm_critical }}
      npm_high: ${{ steps.npm-audit.outputs.npm_high }}
      npm_moderate: ${{ steps.npm-audit.outputs.npm_moderate }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: |
          cd ${{ env.WEB_WORKING_DIR }}
          pnpm install --frozen-lockfile

      - name: Run npm audit
        id: npm-audit
        run: |
          cd ${{ env.WEB_WORKING_DIR }}

          echo "Running npm audit security scan..."
          pnpm audit --json > ../npm-audit-results.json || echo "npm_audit_failed=true" >> $GITHUB_OUTPUT

          cd ..

          # Report counts only when the audit returned them. The deployment gate refuses to
          # pass without them, so a broken audit cannot read as zero vulnerabilities.
          if jq -e '.metadata.vulnerabilities' npm-audit-results.json > /dev/null 2>&1; then
            # Parse npm audit results
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' npm-audit-results.json 2>/dev/null || echo "0")
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' npm-audit-results.json 2>/dev/null || echo "0")
            MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' npm-audit-results.json 2>/dev/null || echo "0")
            LOW=$(jq '.metadata.vulnerabilities.low // 0' npm-audit-results.json 2>/dev/null || echo "0")

            echo "npm_critical=$CRITICAL" >> $GITHUB_OUTPUT
            echo "npm_high=$HIGH" >> $GITHUB_OUTPUT
            echo "npm_moderate=$MODERATE" >> $GITHUB_OUTPUT
            echo "npm_low=$LOW" >> $GITHUB_OUTPUT

            echo "npm audit results:"
            echo "- Critical: $CRITICAL"
            echo "- High: $HIGH"
            echo "- Moderate: $MODERATE"
            echo "- Low: $LOW"
          else
            echo "::warning::pnpm audit returned no vulnerability counts, so the deployment gate will not pass"
          fi

      - name: Run ESLint security rules
        id: eslint-security
        run: |
          cd ${{ env.WEB_WORKING_DIR }}

          echo "Installing ESLint security plugins..."
          pnpm add --save-dev eslint-plugin-security

          echo "Running ESLint with security rules..."

          # Create security-focused ESLint config (flat config, extends the app's eslint.config.mjs)
          cat > eslint.config.security.mjs << 'EOF'
          import security from 'eslint-plugin-security';
          import baseConfig from './eslint.config.mjs';

          export default [
            ...baseConfig,
            {
              plugins: { security },
              rules: {
                'security/detect-object-injection': 'error',
                'security/detect-non-literal-regexp': 'error',
                'security/detect-unsafe-regex': 'error',
                'security/detect-buffer-noassert': 'error',
                'security/detect-child-process': 'error',
                'security/detect-disable-mustache-escape': 'error',
                'security/detect-eval-with-expression': 'error',
                'security/detect-no-csrf-before-method-override': 'error',
                'security/detect-non-literal-fs-filename': 'error',
                'security/detect-non-literal-require': 'error',
                'security/detect-possible-timing-attacks': 'error',
                'security/detect-pseudoRandomBytes': 'error'
              }
            }
          ];
          EOF

          npx eslint . --config eslint.config.security.mjs --format json --output-file ../eslint-security-results.json || echo "eslint_security_failed=true" >> $GITHUB_OUTPUT

          cd ..

          if [ -f eslint-security-results.json ]; then
            ESLINT_ISSUES=$(jq '. | length' eslint-security-results.json 2>/dev/null || echo "0")
            echo "eslint_security_issues=$ESLINT_ISSUES" >> $GITHUB_OUTPUT
            echo "ESLint security issues found: $ESLINT_ISSUES"
          fi

      - name: Check security status
        id: security-check
        run: |
          CRITICAL="${{ steps.npm-audit.outputs.npm_critical || '0' }}"
          HIGH="${{ steps.npm-audit.outputs.npm_high || '0' }}"

          if [ "$CRITICAL" -gt 0 ]; then
            echo "security_passed=false" >> $GITHUB_OUTPUT
            echo "❌ Critical vulnerabilities found - blocking build"
          elif [ "$HIGH" -gt 5 ]; then
            echo "security_passed=false" >> $GITHUB_OUTPUT
            echo "❌ Too many high severity vulnerabilities found - blocking build"
          else
            echo "security_passed=true" >> $GITHUB_OUTPUT
            echo "✅ Security scan passed"
          fi

      - name: Upload dependency security results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-dependency-security-${{ github.run_id }}
          path: |
            npm-audit-results.json
            eslint-security-results.json
          retention-days: 30

      - name: Generate dependency security summary
        run: |
          CRITICAL="${{ steps.npm-audit.outputs.npm_critical || '0' }}"
          HIGH="${{ steps.npm-audit.outputs.npm_high || '0' }}"
          MODERATE="${{ steps.npm-audit.outputs.npm_moderate || '0' }}"
          LOW="${{ steps.npm-audit.outputs.npm_low || '0' }}"
          ESLINT_ISSUES="${{ steps.eslint-security.outputs.eslint_security_issues || '0' }}"

          echo "## 🔒 Web Dependency Security Scan" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### npm audit Results" >> $GITHUB_STEP_SUMMARY
          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY
          echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ESLint Security Issues" >> $GITHUB_STEP_SUMMARY
          echo "- **Issues Found:** $ESLINT_ISSUES" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "$CRITICAL" -gt 0 ]; then
            echo "🚨 **Critical vulnerabilities found!** Build will be blocked." >> $GITHUB_STEP_SUMMARY
          elif [ "$HIGH" -gt 5 ]; then
            echo "⚠️ **Too many high severity vulnerabilities!** Build will be blocked." >> $GITHUB_STEP_SUMMARY
          elif [ "$HIGH" -gt 0 ]; then
            echo "⚠️ **High severity vulnerabilities found!** Review recommended." >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **No critical or high severity vulnerabilities found.**" >> $GITHUB_STEP_SUMMARY
          fi

      # Without this, a blocked build skips the tests, the gate and the deploy, and the run
      # still shows as passing
      - name: Fail when vulnerabilities block the build
        if: steps.security-check.outputs.security_passed != 'true'
        run: |
          echo "::error::The dependency audit found critical vulnerabilities, or more than 5 high ones, so tests, build and deploy are blocked. The job summary has the counts."
          exit 1

  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest
    needs: [detect-changes, dependency-security-scan]
    if: needs.detect-changes.outputs.web_changed == 'true' && needs.dependency-security-scan.outputs.security_passed == 'true'
    outputs:
      build_artifact: ${{ steps.upload-artifact.outputs.artifact-id }}
      build_version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: |
          cd ${{ env.WEB_WORKING_DIR }}
          pnpm install --frozen-lockfile

      - name: Run linting
        run: |
          cd ${{ env.WEB_WORKING_DIR }}
          pnpm lint

      - name: Run type checking
        run: |
          cd ${{ env.WEB_WORKING_DIR }}
          pnpm run type-check || npx tsc --noEmit

      - name: Run unit tests
        if: inputs.skip_tests != true
        id: unit-tests
        run: |
          cd ${{ env.WEB_WORKING_DIR }}

          echo "Running Jest unit tests..."
          pnpm run test --coverage --coverageReporters=text --coverageReporters=lcov \
            --coverageReporters=json --coverageReporters=json-summary \
            --maxWorkers=2 --passWithNoTests || echo "unit_tests_failed=true" >> $GITHUB_OUTPUT

          # Extract coverage percentage
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(node -e "
            const fs = require('fs');
            try {
              const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
              const lines = coverage.total.lines.pct;
              console.log(lines);
            } catch (e) {
              console.log('0');
            }
            ")
            echo "unit_coverage=$COVERAGE" >> $GITHUB_OUTPUT
          else
            echo "unit_coverage=0" >> $GITHUB_OUTPUT
          fi

      - name: Run component tests
        if: inputs.skip_tests != true
        id: component-tests
        run: |
          cd ${{ env.WEB_WORKING_DIR }}

          echo "Running component tests..."
          # Run tests specifically for components
          pnpm run test --testPathPatterns="components|__tests__" --passWithNoTests \
            --verbose || echo "component_tests_failed=true" >> $GITHUB_OUTPUT

          # The *.spec.* component and feature tests use Vitest (root vitest.config.ts)
          (cd .. && pnpm exec vitest run --project web-jsdom) \
            || echo "component_tests_failed=true" >> $GITHUB_OUTPUT

      - name: Run integration tests
        if: inputs.skip_tests != true
        id: integration-tests
        run: |
          cd ${{ env.WEB_WORKING_DIR }}

          echo "Running integration tests..."
          # Run tests for pages and API routes
          pnpm run test --testPathPatterns="pages|api|integration" --passWithNoTests \
            --verbose || echo "integration_tests_failed=true" >> $GITHUB_OUTPUT

      - name: Run accessibility tests
        if: inputs.skip_tests != true
        id: a11y-tests
        run: |
          cd ${{ env.WEB_WORKING_DIR }}

          echo "Running accessibility tests..."
          # Install axe-core for accessibility testing if not present
          if ! pnpm list @axe-core/react >/dev/null 2>&1; then
            echo "Installing accessibility testing dependencies..."
            pnpm add -D @axe-core/react jest-axe
          fi

          # Run accessibility-specific tests
          pnpm run test --testPathPatterns="a11y|accessibility" --passWithNoTests \
            --verbose || echo "a11y_tests_failed=true" >> $GITHUB_OUTPUT

      - name: Generate build version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION="main-$(git rev-parse --short ${{ github.sha }})-$(date +%Y%m%d-%H%M%S)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Generated version: $VERSION"

      - name: Build application
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          cd ${{ env.WEB_WORKING_DIR }}

          # Set build-time environment variables
          echo "NEXT_PUBLIC_BUILD_VERSION=${{ steps.version.outputs.version }}" >> .env.production
          echo "NEXT_PUBLIC_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .env.production
          echo "NEXT_PUBLIC_COMMIT_SHA=${{ github.sha }}" >> .env.production

          # Build the application
          pnpm build

          # Verify build output
          if [ ! -d ".next" ]; then
            echo "Error: Build output directory not found"
            exit 1
          fi

          # Create deployment package
          mkdir -p ../build-output
          cp -r .next/static ../build-output/
          cp -r .next/standalone ../build-output/ 2>/dev/null || echo "No standalone output"
          cp -r public ../build-output/ 2>/dev/null || echo "No public directory"

          # Copy build manifest and other metadata
          cp .next/build-manifest.json ../build-output/ 2>/dev/null || echo "No build manifest"

          # Create deployment metadata
          cat > ../build-output/deployment-info.json << EOF
          {
            "version": "${{ steps.version.outputs.version }}",
            "buildTime": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commitSha": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "environment": "${{ inputs.environment || 'prod' }}",
            "buildId": "${{ github.run_id }}"
          }
          EOF

      - name: Upload test results and coverage
        if: always() && inputs.skip_tests != true
        uses: actions/upload-artifact@v7
        with:
          name: web-test-results-${{ steps.version.outputs.version }}
          path: |
            ${{ env.WEB_WORKING_DIR }}/coverage/
            ${{ env.WEB_WORKING_DIR }}/test-results.xml
          retention-days: 30

      - name: Upload build artifacts
        id: upload-artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-build-${{ steps.version.outputs.version }}
          # out/ only exists when the app builds as a static export (output: 'export'),
          # which is what the S3 and CloudFront deploy below can serve
          path: |
            ${{ env.WEB_WORKING_DIR }}/.next/
            ${{ env.WEB_WORKING_DIR }}/out/
            build-output/
          retention-days: 30
          compression-level: 6

      - name: Generate test and build summary
        run: |
          cd ${{ env.WEB_WORKING_DIR }}

          echo "## 🏗️ Web Application Test & Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Build Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Node.js:** ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Test results summary
          if [ "${{ inputs.skip_tests }}" != "true" ]; then
            echo "### 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
            echo "| Test Suite | Status | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|------------|--------|----------|" >> $GITHUB_STEP_SUMMARY

            UNIT_STATUS="✅ Passed"
            COMPONENT_STATUS="✅ Passed"
            INTEGRATION_STATUS="✅ Passed"
            A11Y_STATUS="✅ Passed"

            if [ "${{ steps.unit-tests.outputs.unit_tests_failed }}" == "true" ]; then
              UNIT_STATUS="❌ Failed"
            fi
            if [ "${{ steps.component-tests.outputs.component_tests_failed }}" == "true" ]; then
              COMPONENT_STATUS="❌ Failed"
            fi
            if [ "${{ steps.integration-tests.outputs.integration_tests_failed }}" == "true" ]; then
              INTEGRATION_STATUS="❌ Failed"
            fi
            if [ "${{ steps.a11y-tests.outputs.a11y_tests_failed }}" == "true" ]; then
              A11Y_STATUS="❌ Failed"
            fi

            UNIT_COVERAGE="${{ steps.unit-tests.outputs.unit_coverage || '0' }}"

            echo "| Unit Tests | $UNIT_STATUS | ${UNIT_COVERAGE}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Component Tests | $COMPONENT_STATUS | - |" >> $GITHUB_STEP_SUMMARY
            echo "| Integration Tests | $INTEGRATION_STATUS | - |" >> $GITHUB_STEP_SUMMARY
            echo "| Accessibility Tests | $A11Y_STATUS | - |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            # Overall test status
            if [ "${{ steps.unit-tests.outputs.unit_tests_failed }}" == "true" ] || \
               [ "${{ steps.component-tests.outputs.component_tests_failed }}" == "true" ] || \
               [ "${{ steps.integration-tests.outputs.integration_tests_failed }}" == "true" ] || \
               [ "${{ steps.a11y-tests.outputs.a11y_tests_failed }}" == "true" ]; then
              echo "**Test Status:** ❌ Some tests failed" >> $GITHUB_STEP_SUMMARY
            else
              echo "**Test Status:** ✅ All tests passed" >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          # Build size analysis
          echo "### 📦 Build Analysis" >> $GITHUB_STEP_SUMMARY
          if [ -d ".next" ]; then
            BUILD_SIZE=$(du -sh .next | cut -f1)
            echo "**Build Size:** $BUILD_SIZE" >> $GITHUB_STEP_SUMMARY

            # Count files
            STATIC_FILES=$(find .next/static -type f | wc -l 2>/dev/null || echo "0")
            echo "**Static Files:** $STATIC_FILES" >> $GITHUB_STEP_SUMMARY

            # Check for build warnings
            if [ -f ".next/build-manifest.json" ]; then
              echo "**Build Status:** ✅ Successful" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Fail if tests failed
          if [ "${{ inputs.skip_tests }}" != "true" ]; then
            if [ "${{ steps.unit-tests.outputs.unit_tests_failed }}" == "true" ] || \
               [ "${{ steps.component-tests.outputs.component_tests_failed }}" == "true" ] || \
               [ "${{ steps.integration-tests.outputs.integration_tests_failed }}" == "true" ] || \
               [ "${{ steps.a11y-tests.outputs.a11y_tests_failed }}" == "true" ]; then
              echo "❌ **Deployment blocked due to test failures**" >> $GITHUB_STEP_SUMMARY
              exit 1
            fi
          fi

          echo "✅ **Ready for deployment**" >> $GITHUB_STEP_SUMMARY

  environment-gate:
    name: Environment Deployment Gate
    runs-on: ubuntu-latest
    needs:
      [
        setup-environment,
        detect-changes,
        test-and-build,
        dependency-security-scan,
      ]
    if: needs.detect-changes.outputs.should_deploy == 'true'
    outputs:
      gate_passed: ${{ steps.gate.outputs.gate_passed }}
      approval_required: ${{ steps.gate.outputs.approval_required }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Prepare security results
        id: security-results
        env:
          CRITICAL: ${{ needs.dependency-security-scan.outputs.npm_critical }}
          HIGH: ${{ needs.dependency-security-scan.outputs.npm_high }}
          MEDIUM: ${{ needs.dependency-security-scan.outputs.npm_moderate }}
        run: |
          # No counts means the audit did not return results, which is not the same as no vulnerabilities
          if [ -z "$CRITICAL" ] || [ -z "$HIGH" ] || [ -z "$MEDIUM" ]; then
            echo "::error::The dependency audit returned no vulnerability counts, so the deployment gate cannot pass. Check the pnpm audit step in the Web Dependency Security Scan job."
            exit 1
          fi
          # $GITHUB_OUTPUT takes one key=value per line, so the JSON has to be compact
          RESULTS=$(jq -nc --argjson critical "$CRITICAL" --argjson high "$HIGH" --argjson medium "$MEDIUM" \
            '{critical: $critical, high: $high, medium: $medium}')
          echo "results=$RESULTS" >> "$GITHUB_OUTPUT"

      - name: Run environment gate
        id: gate
        uses: ./.github/actions/environment-gate
        with:
          environment: ${{ inputs.environment || 'dev' }}
          require_approval: ${{ needs.setup-environment.outputs.require_approval }}
          security_threshold: ${{ needs.setup-environment.outputs.security_threshold }}
          deployment_type: 'web'
          security_results: ${{ steps.security-results.outputs.results }}

  deploy:
    name: Deploy to S3 and CloudFront
    runs-on: ubuntu-latest
    needs: [setup-environment, detect-changes, test-and-build, environment-gate]
    if: |
      needs.environment-gate.outputs.gate_passed == 'true' &&
      needs.detect-changes.outputs.should_deploy == 'true'
    environment:
      name: ${{ inputs.environment || 'dev' }}-web
      url: ${{ steps.deploy.outputs.web_app_url }}
    outputs:
      # true once the S3 sync ran, even if it then failed; false when the deploy skipped
      deploy_started: ${{ steps.s3-deploy.outcome == 'success' || steps.s3-deploy.outcome == 'failure' }}
      s3_bucket: ${{ steps.config.outputs.s3_bucket }}
      distribution_id: ${{ steps.config.outputs.distribution_id }}
      backup_path: ${{ steps.backup.outputs.backup_path }}
      web_app_url: ${{ steps.deploy.outputs.web_app_url }}
      cloudfront_domain: ${{ steps.deploy.outputs.cloudfront_domain }}
      verification_status: ${{ steps.verify.outputs.verification_status }}
      security_status: ${{ steps.security-monitor.outputs.security_status }}
      security_events_detected: ${{ steps.security-monitor.outputs.security_events_detected }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
      HAS_WEBHOOK: ${{ secrets.DEPLOYMENT_WEBHOOK_URL != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Until the AWS setup is done there is no deploy role to assume. A push to main then
      # skips the deploy with a notice instead of failing. A manual run still fails, because
      # someone asked for a deploy. The check runs inside the job so it also sees
      # environment-scoped secrets.
      - name: Check deploy configuration
        id: preflight
        env:
          DEPLOY_ROLE_ARN: ${{ secrets.GITHUB_WEB_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$DEPLOY_ROLE_ARN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          MESSAGE="The web app was not deployed: GITHUB_WEB_DEPLOY_ROLE_ARN is not set for the $TARGET_ENVIRONMENT-web environment."
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "::error::$MESSAGE"
            exit 1
          fi
          echo "::notice::$MESSAGE"
          {
            echo "## Web app not deployed"
            echo ""
            echo "$MESSAGE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Download build artifacts
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/download-artifact@v8
        with:
          name: web-build-${{ needs.test-and-build.outputs.build_version }}
          path: ./artifacts

      # S3 and CloudFront can only serve a static export. A server-rendered build has no
      # index.html, so stop here, before anything in AWS changes, instead of publishing a
      # site without the app in it.
      - name: Check for a static export
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          if [ ! -f artifacts/web/out/index.html ]; then
            echo "::error::The web build has no static export (web/out/index.html), so S3 and CloudFront cannot serve it. web/ builds as a server-rendered Next.js app (it uses rewrites(), headers() and the dynamic documents/[id] route). Make it a static export (output: 'export') or deploy it to a host that runs Next.js."
            exit 1
          fi
          echo "Static export found: $(find artifacts/web/out -type f | wc -l) files"

      - name: Configure AWS credentials
        if: steps.preflight.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.GITHUB_WEB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          role-session-name: GitHubActions-WebDeploy-${{ github.run_id }}

      # Set WEB_S3_BUCKET and WEB_CLOUDFRONT_DISTRIBUTION_ID on the <environment>-web GitHub
      # environment from `terraform output s3_bucket_web_assets` and
      # `terraform output cloudfront_distribution_id`. Without them, the step looks for this
      # environment's bucket by its name prefix, and for the distribution that serves it.
      - name: Get deployment configuration
        id: config
        if: steps.preflight.outputs.enabled == 'true'
        env:
          BUCKET: ${{ vars.WEB_S3_BUCKET }}
          DISTRIBUTION: ${{ vars.WEB_CLOUDFRONT_DISTRIBUTION_ID }}
          BUCKET_PREFIX: ${{ needs.setup-environment.outputs.resource_prefix }}-web-assets-
        run: |
          set -euo pipefail
          if [ -z "$BUCKET" ]; then
            BUCKET=$(aws s3api list-buckets \
              --query "Buckets[?starts_with(Name, '${BUCKET_PREFIX}')].Name | [0]" --output text)
          fi
          if [ -z "$BUCKET" ] || [ "$BUCKET" = "None" ]; then
            echo "::error::No web assets bucket found for $TARGET_ENVIRONMENT (looked for ${BUCKET_PREFIX}*). Set the WEB_S3_BUCKET variable from terraform output."
            exit 1
          fi
          if [ -z "$DISTRIBUTION" ]; then
            DISTRIBUTION=$(aws cloudfront list-distributions \
              --query "DistributionList.Items[?contains(join(',', Origins.Items[].DomainName), '${BUCKET}.s3.')].Id | [0]" \
              --output text)
          fi
          if [ -z "$DISTRIBUTION" ] || [ "$DISTRIBUTION" = "None" ]; then
            echo "::error::No CloudFront distribution serves $BUCKET. Set the WEB_CLOUDFRONT_DISTRIBUTION_ID variable from terraform output."
            exit 1
          fi

          echo "s3_bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "distribution_id=$DISTRIBUTION" >> "$GITHUB_OUTPUT"
          echo "Using S3 bucket: $BUCKET"
          echo "Using CloudFront distribution: $DISTRIBUTION"

      - name: Backup current deployment
        id: backup
        if: steps.preflight.outputs.enabled == 'true'
        env:
          BUCKET: ${{ steps.config.outputs.s3_bucket }}
        run: |
          BACKUP_PREFIX="backups/$(date +%Y%m%d-%H%M%S)-${{ github.sha }}"

          # Check if there are existing files to backup
          if aws s3 ls "s3://$BUCKET/" --recursive | grep -v " backups/" | grep -q .; then
            echo "Creating backup of current deployment..."
            aws s3 sync "s3://$BUCKET/" "s3://$BUCKET/$BACKUP_PREFIX/" \
              --exclude "backups/*" \
              --quiet
            echo "backup_path=$BACKUP_PREFIX" >> "$GITHUB_OUTPUT"
            echo "Backup created at: $BACKUP_PREFIX"
          else
            echo "No existing deployment to backup"
            echo "backup_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to S3
        id: s3-deploy
        if: steps.preflight.outputs.enabled == 'true'
        env:
          BUCKET: ${{ steps.config.outputs.s3_bucket }}
        run: |
          set -euo pipefail
          SITE=artifacts/web/out
          if [ -f artifacts/build-output/deployment-info.json ]; then
            cp artifacts/build-output/deployment-info.json "$SITE/"
          fi

          echo "Deploying to S3 bucket: $BUCKET"
          # Hashed assets: cache for a year. Everything else: revalidate every request.
          # Excluding backups/ keeps --delete from removing the backup taken above.
          aws s3 sync "$SITE/" "s3://$BUCKET/" --delete \
            --exclude "*" --include "_next/static/*" \
            --cache-control "public, max-age=31536000, immutable"
          aws s3 sync "$SITE/" "s3://$BUCKET/" --delete \
            --exclude "_next/static/*" --exclude "backups/*" \
            --cache-control "public, max-age=0, must-revalidate"

          echo "S3 deployment completed"

      - name: Invalidate CloudFront cache
        id: cloudfront-invalidate
        if: steps.preflight.outputs.enabled == 'true'
        env:
          DISTRIBUTION: ${{ steps.config.outputs.distribution_id }}
        run: |
          echo "Creating CloudFront invalidation..."

          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "invalidation_id=$INVALIDATION_ID" >> "$GITHUB_OUTPUT"
          echo "CloudFront invalidation created: $INVALIDATION_ID"

          # Wait for invalidation to complete (with timeout)
          echo "Waiting for invalidation to complete..."
          timeout 300 aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION" \
            --id "$INVALIDATION_ID" || echo "Invalidation timeout - continuing"

      - name: Get deployment URLs
        id: deploy
        if: steps.preflight.outputs.enabled == 'true'
        env:
          DISTRIBUTION: ${{ steps.config.outputs.distribution_id }}
        run: |
          # Get CloudFront domain
          CLOUDFRONT_DOMAIN=$(aws cloudfront get-distribution \
            --id "$DISTRIBUTION" \
            --query 'Distribution.DomainName' \
            --output text)

          # Check if custom domain is configured
          CUSTOM_DOMAIN=$(aws cloudfront get-distribution \
            --id "$DISTRIBUTION" \
            --query 'Distribution.DistributionConfig.Aliases.Items[0]' \
            --output text 2>/dev/null || echo "None")

          if [ "$CUSTOM_DOMAIN" != "None" ] && [ "$CUSTOM_DOMAIN" != "null" ]; then
            WEB_APP_URL="https://$CUSTOM_DOMAIN"
          else
            WEB_APP_URL="https://$CLOUDFRONT_DOMAIN"
          fi

          echo "web_app_url=$WEB_APP_URL" >> "$GITHUB_OUTPUT"
          echo "cloudfront_domain=$CLOUDFRONT_DOMAIN" >> "$GITHUB_OUTPUT"
          echo "Web application URL: $WEB_APP_URL"

      - name: Verify deployment
        id: verify
        if: steps.preflight.outputs.enabled == 'true'
        env:
          WEB_APP_URL: ${{ steps.deploy.outputs.web_app_url }}
        run: |
          echo "Verifying deployment..."

          # Wait a moment for CloudFront to propagate
          sleep 30

          # Test the main page
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$WEB_APP_URL" || echo "000")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Deployment verification successful (HTTP $HTTP_STATUS)"
            echo "verification_status=success" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Deployment verification failed (HTTP $HTTP_STATUS)"
            echo "verification_status=failed" >> "$GITHUB_OUTPUT"

            # Try to get more details
            echo "Attempting to get response details..."
            curl -v "$WEB_APP_URL" || true
          fi

          # Test a static asset
          STATIC_URL="$WEB_APP_URL/_next/static"
          STATIC_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STATIC_URL" || echo "000")
          echo "Static assets status: $STATIC_STATUS"

      # Runs here rather than in its own job so it can use this environment's deploy role.
      # Monitoring problems are reported but never fail a deploy that already went out.
      - name: Monitor web security events
        id: security-monitor
        if: steps.preflight.outputs.enabled == 'true' && env.HAS_WEBHOOK == 'true'
        continue-on-error: true
        uses: ./.github/actions/security-monitor
        with:
          webhook_url: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
          aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}
          monitoring_duration: '5'
          service_name: 'web-application'

      - name: Generate deployment summary
        if: steps.preflight.outputs.enabled == 'true'
        run: |
          echo "## 🚀 Web Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** $TARGET_ENVIRONMENT" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.test-and-build.outputs.build_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed at:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**URLs:**" >> $GITHUB_STEP_SUMMARY
          echo "- 🌐 Web App: ${{ steps.deploy.outputs.web_app_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- ☁️ CloudFront: https://${{ steps.deploy.outputs.cloudfront_domain }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Infrastructure:**" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 S3 Bucket: ${{ steps.config.outputs.s3_bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 CloudFront Distribution: ${{ steps.config.outputs.distribution_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🔄 Invalidation: ${{ steps.cloudfront-invalidate.outputs.invalidation_id }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.verify.outputs.verification_status }}" = "success" ]; then
            echo "**Status:** ✅ Deployment successful and verified" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ⚠️ Deployment completed but verification failed" >> $GITHUB_STEP_SUMMARY
          fi

      # Track and roll back only once files went to S3; the environment is the one deployed to.
      # Tracking is bookkeeping: the web deploy role has no DynamoDB access yet, and a
      # tracking failure must not mark a working deploy as failed.
      - name: Track deployment state
        if: always() && steps.s3-deploy.outcome != 'skipped'
        continue-on-error: true
        uses: ./.github/actions/deployment-state
        with:
          action: track
          service: web
          environment: ${{ inputs.environment || 'dev' }}
          version: ${{ needs.test-and-build.outputs.build_version }}
          status: ${{ steps.verify.outputs.verification_status == 'success' && 'success' || 'failed' }}
          health_status: ${{ steps.verify.outputs.verification_status || 'unknown' }}
          aws_region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Trigger automatic rollback on failure
        if: (failure() || steps.verify.outputs.verification_status == 'failed') && steps.s3-deploy.outcome != 'skipped'
        uses: ./.github/actions/auto-rollback
        with:
          service: web
          environment: ${{ inputs.environment || 'dev' }}
          health_check_failed: ${{ steps.verify.outputs.verification_status == 'failed' || 'true' }}
          rollback_threshold: 2
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Rollback is not automated. When a deploy fails after it changed S3, this job explains
  # how to restore the backup the deploy job took. It does not touch AWS itself.
  rollback:
    name: Rollback Instructions
    runs-on: ubuntu-latest
    needs: [detect-changes, test-and-build, deploy]
    if: failure() && needs.deploy.result == 'failure' && needs.deploy.outputs.deploy_started == 'true'
    env:
      BUCKET: ${{ needs.deploy.outputs.s3_bucket }}
      BACKUP_PATH: ${{ needs.deploy.outputs.backup_path }}
      DISTRIBUTION: ${{ needs.deploy.outputs.distribution_id }}

    steps:
      - name: Explain how to restore the previous version
        run: |
          {
            echo "## Web deploy failed after changing S3"
            echo ""
            if [ -n "$BACKUP_PATH" ]; then
              echo "Automatic rollback is not implemented. To restore the previous version, run these with the deploy role:"
              echo ""
              echo '```bash'
              echo "aws s3 cp \"s3://$BUCKET/$BACKUP_PATH/\" \"s3://$BUCKET/\" --recursive"
              echo "aws cloudfront create-invalidation --distribution-id \"$DISTRIBUTION\" --paths \"/*\""
              echo '```'
              echo ""
              echo "Files that only the failed deploy added stay in the bucket until the next deploy removes them."
              echo "Do not restore with \`aws s3 sync --delete --exclude \"backups/*\"\`: the exclude also matches the backup, so it deletes the live site."
            else
              echo "The bucket had no site in it before this deploy, so there is no backup to restore."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::The web deploy failed after changing S3. The run summary explains how to restore the previous version."

  notify-deployment:
    name: Notify Deployment
    runs-on: ubuntu-latest
    needs: [detect-changes, test-and-build, deploy, rollback]
    if: always() && needs.detect-changes.outputs.should_deploy == 'true'
    env:
      HAS_WEBHOOK: ${{ secrets.DEPLOYMENT_WEBHOOK_URL != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Notify deployment start
        if: env.HAS_WEBHOOK == 'true' && github.event_name != 'pull_request'
        uses: ./.github/actions/notify-deployment
        with:
          webhook_url: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
          notification_type: 'start'
          service_name: 'web-application'
          environment: ${{ inputs.environment || 'dev' }}
          version: ${{ needs.test-and-build.outputs.build_version }}
          commit_sha: ${{ github.sha }}
          workflow_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          additional_context: |
            {
              "deployment_type": "web",
              "build_version": "${{ needs.test-and-build.outputs.build_version }}",
              "trigger": "${{ github.event_name }}"
            }

      - name: Notify deployment success
        if: env.HAS_WEBHOOK == 'true' && needs.deploy.result == 'success' && needs.deploy.outputs.deploy_started == 'true'
        uses: ./.github/actions/notify-deployment
        with:
          webhook_url: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
          notification_type: 'success'
          service_name: 'web-application'
          environment: ${{ inputs.environment || 'dev' }}
          version: ${{ needs.test-and-build.outputs.build_version }}
          commit_sha: ${{ github.sha }}
          deployment_url: ${{ needs.deploy.outputs.web_app_url }}
          workflow_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          additional_context: |
            {
              "deployment_type": "web",
              "cloudfront_domain": "${{ needs.deploy.outputs.cloudfront_domain }}",
              "verification_status": "${{ needs.deploy.outputs.verification_status }}",
              "security_status": "${{ needs.deploy.outputs.security_status || 'not_monitored' }}"
            }

      - name: Notify deployment failure
        if: env.HAS_WEBHOOK == 'true' && needs.deploy.result == 'failure'
        uses: ./.github/actions/notify-deployment
        with:
          webhook_url: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
          notification_type: 'failure'
          service_name: 'web-application'
          environment: ${{ inputs.environment || 'dev' }}
          version: ${{ needs.test-and-build.outputs.build_version }}
          commit_sha: ${{ github.sha }}
          workflow_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          error_details: |
            Web application deployment failed during the following stages:
            - Build and Test: ${{ needs.test-and-build.result }}
            - S3 Deployment: ${{ needs.deploy.result }}

            Common issues to check:
            - Build compilation errors
            - S3 bucket permissions
            - CloudFront distribution configuration
            - DNS/SSL certificate issues

            Rollback status: ${{ needs.rollback.result || 'not_attempted' }}
          additional_context: |
            {
              "deployment_type": "web",
              "build_version": "${{ needs.test-and-build.outputs.build_version }}",
              "rollback_attempted": "${{ needs.rollback.result != '' }}",
              "manual_intervention_required": true
            }

      - name: Notify rollback needed
        if: env.HAS_WEBHOOK == 'true' && needs.rollback.result != 'skipped' && needs.rollback.result != ''
        uses: ./.github/actions/notify-deployment
        with:
          webhook_url: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
          notification_type: 'rollback'
          service_name: 'web-application'
          environment: ${{ inputs.environment || 'dev' }}
          version: ${{ needs.test-and-build.outputs.build_version }}
          commit_sha: ${{ github.sha }}
          workflow_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          error_details: |
            The deployment failed after it changed S3, so the site may be serving a partial deploy.
            Automatic rollback is not implemented.

            Failed deployment version: ${{ needs.test-and-build.outputs.build_version }}

            The workflow run summary explains how to restore the previous version.
          additional_context: |
            {
              "deployment_type": "web",
              "rollback_reason": "deployment_failure",
              "rollback_status": "${{ needs.rollback.result }}",
              "verification_required": true
            }

      - name: Notify security alerts
        if: env.HAS_WEBHOOK == 'true' && needs.deploy.outputs.security_status == 'alert'
        uses: ./.github/actions/notify-deployment
        with:
          webhook_url: ${{ secrets.DEPLOYMENT_WEBHOOK_URL }}
          notification_type: 'security_alert'
          service_name: 'web-application'
          environment: ${{ inputs.environment || 'dev' }}
          version: ${{ needs.test-and-build.outputs.build_version }}
          commit_sha: ${{ github.sha }}
          deployment_url: ${{ needs.deploy.outputs.web_app_url }}
          workflow_url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          security_event: |
            Security events detected during web application deployment:
            - Application URL: ${{ needs.deploy.outputs.web_app_url }}
            - Security status: ${{ needs.deploy.outputs.security_status }}
            - Events detected: ${{ needs.deploy.outputs.security_events_detected }}

            Immediate security review recommended for the deployed web application.
          additional_context: |
            {
              "deployment_type": "web",
              "security_level": "high",
              "application_url": "${{ needs.deploy.outputs.web_app_url }}",
              "immediate_action_required": true
            }

      - name: Log notification summary
        run: |
          echo "## 📢 Web Deployment Notifications" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.test-and-build.outputs.build_version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment || 'dev' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Status:** ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Security Status:** ${{ needs.deploy.outputs.security_status || 'not_monitored' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Notifications Sent:** ${{ env.HAS_WEBHOOK == 'true' && 'Yes' || 'No (webhook not configured)' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.deploy.result }}" = "success" ] && [ "${{ needs.deploy.outputs.deploy_started }}" = "true" ]; then
            echo "✅ **Web application deployed successfully**" >> $GITHUB_STEP_SUMMARY
            if [ -n "${{ needs.deploy.outputs.web_app_url }}" ]; then
              echo "🌐 **Application URL:** ${{ needs.deploy.outputs.web_app_url }}" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "ℹ️ **Web application not deployed.** The deploy job's summary says why." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Web application deployment failed**" >> $GITHUB_STEP_SUMMARY
            if [ "${{ needs.rollback.result }}" != "skipped" ] && [ -n "${{ needs.rollback.result }}" ]; then
              echo "🔄 **Rollback Status:** ${{ needs.rollback.result }}" >> $GITHUB_STEP_SUMMARY
            fi
            echo "📋 **Action Required:** Review deployment logs and address issues" >> $GITHUB_STEP_SUMMARY
          fi
