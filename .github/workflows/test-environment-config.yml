name: Test Environment Configuration

on:
  workflow_dispatch:
    inputs:
      test_environment:
        description: 'Environment to test'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      test_branch:
        description: 'Branch to test deployment from'
        required: false
        default: 'main'
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  test-environment-setup:
    name: Test Environment Setup
    runs-on: ubuntu-latest
    outputs:
      config_valid: ${{ steps.validate.outputs.valid }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test environment configuration loading
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          environment: ${{ inputs.test_environment }}

      - name: Validate configuration outputs
        id: validate
        run: |
          echo "🧪 Testing environment configuration for: ${{ inputs.test_environment }}"
          echo ""

          # Check required outputs
          REQUIRE_APPROVAL="${{ steps.setup.outputs.require_approval }}"
          SECURITY_THRESHOLD="${{ steps.setup.outputs.security_threshold }}"
          DEPLOYMENT_STRATEGY="${{ steps.setup.outputs.deployment_strategy }}"
          RESOURCE_PREFIX="${{ steps.setup.outputs.resource_prefix }}"

          echo "Configuration values:"
          echo "  - Require Approval: $REQUIRE_APPROVAL"
          echo "  - Security Threshold: $SECURITY_THRESHOLD"
          echo "  - Deployment Strategy: $DEPLOYMENT_STRATEGY"
          echo "  - Resource Prefix: $RESOURCE_PREFIX"
          echo ""

          # Validate values are not empty
          VALID=true

          if [ -z "$REQUIRE_APPROVAL" ]; then
            echo "❌ require_approval is empty"
            VALID=false
          fi

          if [ -z "$SECURITY_THRESHOLD" ]; then
            echo "❌ security_threshold is empty"
            VALID=false
          fi

          if [ -z "$DEPLOYMENT_STRATEGY" ]; then
            echo "❌ deployment_strategy is empty"
            VALID=false
          fi

          if [ -z "$RESOURCE_PREFIX" ]; then
            echo "❌ resource_prefix is empty"
            VALID=false
          fi

          # Validate security threshold values
          if [[ ! "$SECURITY_THRESHOLD" =~ ^(critical|high|medium|low)$ ]]; then
            echo "❌ Invalid security_threshold: $SECURITY_THRESHOLD"
            VALID=false
          fi

          # Validate boolean values
          if [[ ! "$REQUIRE_APPROVAL" =~ ^(true|false)$ ]]; then
            echo "❌ Invalid require_approval: $REQUIRE_APPROVAL"
            VALID=false
          fi

          echo "valid=$VALID" >> $GITHUB_OUTPUT

          if [ "$VALID" = "true" ]; then
            echo "✅ Configuration validation passed"
          else
            echo "❌ Configuration validation failed"
            exit 1
          fi

  test-environment-gate:
    name: Test Environment Gate
    runs-on: ubuntu-latest
    needs: test-environment-setup
    if: needs.test-environment-setup.outputs.config_valid == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment configuration
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          environment: ${{ inputs.test_environment }}

      - name: Test environment gate with mock security results
        id: gate
        uses: ./.github/actions/environment-gate
        with:
          environment: ${{ inputs.test_environment }}
          require_approval: ${{ steps.setup.outputs.require_approval }}
          security_threshold: ${{ steps.setup.outputs.security_threshold }}
          deployment_type: 'test'
          security_results: |
            {
              "critical": 0,
              "high": 1,
              "medium": 3
            }

      - name: Validate gate results
        run: |
          echo "🚪 Testing environment gate for: ${{ inputs.test_environment }}"
          echo ""

          GATE_PASSED="${{ steps.gate.outputs.gate_passed }}"
          APPROVAL_REQUIRED="${{ steps.gate.outputs.approval_required }}"

          echo "Gate results:"
          echo "  - Gate Passed: $GATE_PASSED"
          echo "  - Approval Required: $APPROVAL_REQUIRED"
          echo ""

          # Validate expected behavior based on environment
          case "${{ inputs.test_environment }}" in
            "dev")
              if [ "$APPROVAL_REQUIRED" = "true" ]; then
                echo "⚠️ Unexpected: Development environment should not require approval"
              else
                echo "✅ Correct: Development environment does not require approval"
              fi
              ;;
            "staging")
              echo "ℹ️ Staging environment approval depends on deployment type"
              ;;
            "prod")
              if [ "$APPROVAL_REQUIRED" = "false" ]; then
                echo "⚠️ Unexpected: Production environment should require approval"
              else
                echo "✅ Correct: Production environment requires approval"
              fi
              ;;
          esac

  test-branch-permissions:
    name: Test Branch and Tag Permissions
    runs-on: ubuntu-latest
    needs: test-environment-setup
    if: needs.test-environment-setup.outputs.config_valid == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # validate-ref.sh is the script behind setup-environment's "Validate branch and tag
      # permissions" step
      - name: Test branch and tag permissions
        run: |
          echo "🌿 Testing branch and tag permissions"
          echo ""

          FAILED=0

          # Usage: check <environment> <ref-type> <ref-name> <allowed-branches-json> <allowed-tags-json> <allowed|denied>
          check() {
            local result=denied
            if bash .github/actions/setup-environment/validate-ref.sh "$1" "$2" "$3" "$4" "$5" > /dev/null; then
              result=allowed
            fi

            if [ "$result" = "$6" ]; then
              echo "✅ ${2:-(no type)} '$3' on $1: $result"
            else
              echo "❌ ${2:-(no type)} '$3' on $1: $result, expected $6"
              FAILED=1
            fi
          }

          # Usage: check_env <environment> <ref-type> <ref-name> <allowed|denied>
          # Reads the allowed lists from .github/environments the way action.yml does
          check_env() {
            local config=".github/environments/$1.yml"
            check "$1" "$2" "$3" \
              "$(yq eval '.settings.allowed_branches // ["main"]' "$config" -o=json -I=0)" \
              "$(yq eval '.settings.allowed_tags // []' "$config" -o=json -I=0)" \
              "$4"
          }

          # Branch patterns are globs matched against the whole name
          check example branch main '["main"]' '[]' allowed
          check example branch main2 '["main"]' '[]' denied
          check example branch xmain '["main"]' '[]' denied
          check example branch feature/a '["feature/*"]' '[]' allowed
          check example branch feature/a/b '["feature/*"]' '[]' allowed
          check example branch featurex '["feature/*"]' '[]' denied
          check example branch release/1x0 '["release/1.0"]' '[]' denied

          # Any ref type other than tag is checked as a branch
          check example "" main '["main"]' '[]' allowed

          # An empty or malformed branch list allows nothing
          check example branch main '[]' '[]' denied
          check example branch main '' '[]' denied
          check example branch main '"main"' '[]' denied

          # Tag patterns match the whole tag as a glob, and no list means no tags
          check example tag v1.2.0 '[]' '["v*"]' allowed
          check example tag v2.0.0-rc.1 '[]' '["v*"]' allowed
          check example tag wordpress-plugin-v1.0 '[]' '["v*"]' denied
          check example tag release/1.0 '[]' '["release/*"]' allowed
          check example tag v1.2.0 '[]' '[]' denied
          check example tag v1.2.0 '[]' '' denied
          check example tag v1.2.0 '[]' '"v*"' denied

          # A branch is never checked against the tag list, or a tag against the branch list
          check example branch v1.2.0 '["main"]' '["v*"]' denied
          check example tag main '["main"]' '["v*"]' denied

          # Rules in .github/environments
          check_env dev branch main allowed
          check_env dev branch develop allowed
          check_env dev branch feature/x allowed
          check_env dev branch hotfix/x allowed
          check_env dev branch release/1.0 denied
          check_env dev tag v1.2.0 allowed
          check_env dev tag wordpress-plugin-v1.0 denied
          check_env staging branch main allowed
          check_env staging branch release/1.0 allowed
          check_env staging branch develop denied
          check_env staging branch feature/x denied
          check_env staging tag v1.2.0 denied
          check_env prod branch main allowed
          check_env prod branch develop denied
          check_env prod branch feature/x denied
          check_env prod branch release/1.0 denied
          check_env prod tag v1.2.0 allowed
          check_env prod tag wordpress-plugin-v1.0 denied
          check_env prod tag main denied

          exit "$FAILED"

      # Reports on the dispatch inputs without failing: a restricted branch is a valid input
      - name: Check the requested branch
        env:
          TEST_ENVIRONMENT: ${{ inputs.test_environment }}
          TEST_BRANCH: ${{ inputs.test_branch || github.ref_name }}
        run: |
          CONFIG=".github/environments/$TEST_ENVIRONMENT.yml"
          ALLOWED_BRANCHES=$(yq eval '.settings.allowed_branches // ["main"]' "$CONFIG" -o=json -I=0)
          ALLOWED_TAGS=$(yq eval '.settings.allowed_tags // []' "$CONFIG" -o=json -I=0)

          if ! bash .github/actions/setup-environment/validate-ref.sh "$TEST_ENVIRONMENT" branch "$TEST_BRANCH" "$ALLOWED_BRANCHES" "$ALLOWED_TAGS"; then
            echo "This is expected behavior if testing with a restricted branch"
          fi

  test-security-thresholds:
    name: Test Security Thresholds
    runs-on: ubuntu-latest
    needs: test-environment-setup
    if: needs.test-environment-setup.outputs.config_valid == 'true'
    strategy:
      matrix:
        security_scenario:
          - name: 'no-vulnerabilities'
            critical: 0
            high: 0
            medium: 0
          - name: 'medium-vulnerabilities'
            critical: 0
            high: 0
            medium: 5
          - name: 'high-vulnerabilities'
            critical: 0
            high: 2
            medium: 3
          - name: 'critical-vulnerabilities'
            critical: 1
            high: 1
            medium: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup environment configuration
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          environment: ${{ inputs.test_environment }}

      - name: Test security threshold - ${{ matrix.security_scenario.name }}
        id: gate
        uses: ./.github/actions/environment-gate
        with:
          environment: ${{ inputs.test_environment }}
          require_approval: ${{ steps.setup.outputs.require_approval }}
          security_threshold: ${{ steps.setup.outputs.security_threshold }}
          deployment_type: 'test'
          security_results: |
            {
              "critical": ${{ matrix.security_scenario.critical }},
              "high": ${{ matrix.security_scenario.high }},
              "medium": ${{ matrix.security_scenario.medium }}
            }
        continue-on-error: true

      - name: Analyze security threshold behavior
        run: |
          echo "🔒 Testing security threshold behavior"
          echo "Scenario: ${{ matrix.security_scenario.name }}"
          echo "Environment: ${{ inputs.test_environment }}"
          echo "Security Threshold: ${{ steps.setup.outputs.security_threshold }}"
          echo ""

          GATE_PASSED="${{ steps.gate.outputs.gate_passed }}"
          SECURITY_THRESHOLD="${{ steps.setup.outputs.security_threshold }}"

          CRITICAL=${{ matrix.security_scenario.critical }}
          HIGH=${{ matrix.security_scenario.high }}
          MEDIUM=${{ matrix.security_scenario.medium }}

          echo "Vulnerabilities: Critical=$CRITICAL, High=$HIGH, Medium=$MEDIUM"
          echo "Gate Passed: $GATE_PASSED"
          echo ""

          # Analyze expected vs actual behavior
          EXPECTED_PASS=true

          case "$SECURITY_THRESHOLD" in
            "critical")
              if [ "$CRITICAL" -gt 0 ]; then
                EXPECTED_PASS=false
              fi
              ;;
            "high")
              if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
                EXPECTED_PASS=false
              fi
              ;;
            "medium")
              if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 5 ]; then
                EXPECTED_PASS=false
              fi
              ;;
          esac

          if [ "$GATE_PASSED" = "$EXPECTED_PASS" ]; then
            echo "✅ Security threshold behavior is correct"
          else
            echo "❌ Security threshold behavior is unexpected"
            echo "Expected gate to pass: $EXPECTED_PASS"
            echo "Actual gate passed: $GATE_PASSED"
          fi

  generate-test-report:
    name: Generate Test Report
    runs-on: ubuntu-latest
    needs:
      [
        test-environment-setup,
        test-environment-gate,
        test-branch-permissions,
        test-security-thresholds,
      ]
    if: always()

    steps:
      - name: Generate comprehensive test report
        run: |
          echo "## 🧪 Environment Configuration Test Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Test Environment:** ${{ inputs.test_environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Test Branch:** ${{ inputs.test_branch || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Test Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Test results summary
          echo "### Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY

          # Environment setup test
          if [ "${{ needs.test-environment-setup.result }}" = "success" ]; then
            echo "| Environment Setup | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Environment Setup | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          # Environment gate test
          if [ "${{ needs.test-environment-gate.result }}" = "success" ]; then
            echo "| Environment Gate | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Environment Gate | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          # Branch and tag permissions test
          if [ "${{ needs.test-branch-permissions.result }}" = "success" ]; then
            echo "| Branch and Tag Permissions | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Branch and Tag Permissions | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          # Security thresholds test
          if [ "${{ needs.test-security-thresholds.result }}" = "success" ]; then
            echo "| Security Thresholds | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Security Thresholds | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          if [ "${{ needs.test-environment-setup.result }}" = "success" ] && \
             [ "${{ needs.test-environment-gate.result }}" = "success" ] && \
             [ "${{ needs.test-branch-permissions.result }}" = "success" ] && \
             [ "${{ needs.test-security-thresholds.result }}" = "success" ]; then
            echo "### ✅ Overall Status: All Tests Passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The environment-specific deployment configuration for **${{ inputs.test_environment }}** is working correctly." >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ Overall Status: Some Tests Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "There are issues with the environment-specific deployment configuration for **${{ inputs.test_environment }}**." >> $GITHUB_STEP_SUMMARY
            echo "Please review the failed test results and fix the configuration." >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Review the test results above" >> $GITHUB_STEP_SUMMARY
          echo "2. Fix any configuration issues identified" >> $GITHUB_STEP_SUMMARY
          echo "3. Test deployment workflows in the target environment" >> $GITHUB_STEP_SUMMARY
          echo "4. Verify branch protection rules are properly configured" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "For more information, see the [Environment Deployment Guide](.github/workflows/ENVIRONMENT_DEPLOYMENT_GUIDE.md)" >> $GITHUB_STEP_SUMMARY
