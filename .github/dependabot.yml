version: 2
updates:
  - package-ecosystem: 'github-actions'
    # The root covers .github/workflows; the second entry covers the composite actions.
    directories:
      - '/'
      - '/.github/actions/*'
    schedule:
      interval: 'weekly'
    groups:
      github-actions:
        patterns:
          - '*'

  # The pnpm workspace root: one lockfile covers apps/*, web, dashboard, integrations/* and packages/*.
  # Minor and patch updates arrive as one pull request; each major version gets its own.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    ignore:
      # TypeScript 7 removes baseUrl and the compiler API that Danger uses.
      - dependency-name: 'typescript'
        versions: ['>=7']
      # Keep the Node type definitions on the runtime's major version (Node 24).
      - dependency-name: '@types/node'
        versions: ['>=25']
    groups:
      # The typescript-eslint plugin and parser must move together.
      typescript-eslint:
        patterns:
          - '@typescript-eslint/*'
          - 'typescript-eslint'
      npm-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'

  # Every directory with a requirements file or pyproject.toml
  - package-ecosystem: 'pip'
    directories:
      - '/'
      - '/services/api'
      - '/services/worker'
      - '/services/timeout-monitor'
      - '/services/functions/exporter'
      - '/services/functions/notifier'
      - '/services/functions/ocr'
      - '/services/functions/router'
      - '/services/functions/structure'
      - '/services/functions/tagger'
      - '/services/functions/validator'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      python-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
